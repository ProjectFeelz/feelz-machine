<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Feelz Machine - Independent Music Platform"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Feelz Machine" />
    <meta property="og:description" content="Upload, stream, and sell your music directly to fans. Discover independent artists, follow your favourites, and support music without the middleman." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.feelzmachine.com/" />
    <meta property="og:image" content="https://www.feelzmachine.com/og-default.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Feelz Machine" />
    <meta name="twitter:description" content="Upload, stream, and sell your music directly to fans. Discover independent artists, follow your favourites, and support music without the middleman." />
    <meta name="twitter:image" content="https://www.feelzmachine.com/og-default.png" />

    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Feelz Machine" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Sign in with Apple (required for iOS App Store) -->
    <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
    <meta name="appleid-signin-client-id" content="com.feelzmachine.app" />
    <meta name="appleid-signin-scope" content="name email" />
    <meta name="appleid-signin-redirect-uri" content="https://www.feelzmachine.com/auth/apple/callback" />
    <meta name="appleid-signin-state" content="feelzmachine-auth" />
    <meta name="appleid-signin-use-popup" content="true" />

    <title>Feelz Machine</title>

    <style>
      html, body {
        background-color: #000000;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        background-color: #000000;
      }
    </style>
    <style>
      @media (max-width: 767px) {
        html { font-size: 17px; }
      }
    </style>
  </head>
  <body style="background-color:#000000;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js');
      }
    </script>
  </body>
</html>
