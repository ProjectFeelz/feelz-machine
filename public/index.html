<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary SEO -->
    <title>Feelz Machine — Independent Music Streaming & Discovery</title>
    <meta name="description" content="Discover and stream independent music from artists worldwide. Follow your favourite artists, like tracks, build playlists, and support musicians directly. Afrobeats, Hip Hop, Amapiano, R&B and more." />
    <meta name="keywords" content="independent music, music streaming, afrobeats, amapiano, hip hop, R&B, independent artists, music discovery, stream music, support artists" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.feelzmachine.com" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.feelzmachine.com" />
    <meta property="og:title" content="Feelz Machine — Independent Music Streaming & Discovery" />
    <meta property="og:description" content="Stream and discover independent music. Support artists directly. No middlemen." />
    <meta property="og:image" content="https://www.feelzmachine.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Feelz Machine" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@feelzmachine" />
    <meta name="twitter:title" content="Feelz Machine — Independent Music Streaming" />
    <meta name="twitter:description" content="Stream and discover independent music. Support artists directly." />
    <meta name="twitter:image" content="https://www.feelzmachine.com/og-image.png" />

    <!-- PWA -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Structured Data — Music Streaming Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Feelz Machine",
      "url": "https://www.feelzmachine.com",
      "description": "Independent music streaming and discovery platform. Stream music from independent artists worldwide.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.feelzmachine.com/browse?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data — Music App -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "Feelz Machine",
      "operatingSystem": "Android, iOS, Web",
      "applicationCategory": "MusicApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Discover and stream independent music. Follow artists, build playlists, and support musicians directly.",
      "url": "https://www.feelzmachine.com"
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Feelz Machine.</noscript>
    <div id="root"></div>
  </body>
</html>
