<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · Feelz Machine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: rgba(255,255,255,0.4); line-height: 1.6; max-width: 280px; }
    button {
      margin-top: 28px;
      padding: 12px 28px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <img src="/logo.png" alt="Feelz Machine" />
  <h1>You're offline</h1>
  <p>No internet connection right now. Check your signal and try again.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
