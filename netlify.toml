[build]
  command = "sed -i \"s/feelz-v[0-9]*/feelz-$(date +%Y%m%d%H%M)/g\" public/service-worker.js && npm run build"
  publish = "build"

[build.environment]
  REACT_APP_VAPID_PUBLIC_KEY = "BASwU9c4nwdW8W43aOOrqfiYooWNHM_wkVdJTblUyBsjdFpOOtRIJBtTD7vw6fJU9AlEg3sOL_n5mp0RabRWSPc"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."convert-to-mp4"]
  included_files = ["node_modules/ffmpeg-static/**"]
  timeout = 26

[functions."convert-audio"]
  included_files = ["node_modules/ffmpeg-static/**"]
  timeout = 26

[functions."engagement-drip-background"]
  timeout = 860

# ── Cache headers ─────────────────────────────────────────────────────────────

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/static/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Scheduled functions ───────────────────────────────────────────────────────
# Full Sunday calendar:
#   09:00 — weekly-wheel-spin (every Sunday — new challenge)
#   09:00 — paid-collab-reminder (3rd Sunday only — internal check)
#   17:00 — voting opens (handled by status transition in close function)
#   23:59 — close-wheel-competition (crowns winner, pays out, notifies)
#
# Monday 08:00 — weekly-artist-report
# Monday 08:00 — engagement-drip-cron (also Thursday)
# Daily  00:05 — daily-spotlight
# Daily  02:00 — cleanup-stories
# Daily  02:30 — cleanup-empty-albums
# Daily  09:00 — presave-notify
# 1st of month 09:00 — monthly-wrapped
# Sunday 18:00 — weekly-listener-recap

[[scheduled_functions]]
  name = "engagement-drip-cron"
  schedule = "0 8 * * 1,4"

[[scheduled_functions]]
  name = "monthly-wrapped"
  schedule = "0 9 1 * *"

[[scheduled_functions]]
  name = "daily-spotlight"
  schedule = "5 0 * * *"

[[scheduled_functions]]
  name = "weekly-artist-report"
  schedule = "0 8 * * 1"

[[scheduled_functions]]
  name = "weekly-listener-recap"
  schedule = "0 18 * * 0"

[[scheduled_functions]]
  name = "presave-notify"
  schedule = "0 9 * * *"

[[scheduled_functions]]
  name = "cleanup-stories"
  schedule = "0 2 * * *"

[[scheduled_functions]]
  name = "cleanup-empty-albums"
  schedule = "30 2 * * *"

[[scheduled_functions]]
  name = "weekly-wheel-spin"
  schedule = "0 9 * * 0"

[[scheduled_functions]]
  name = "close-wheel-competition"
  schedule = "59 23 * * 0"

[[scheduled_functions]]
  name = "paid-collab-reminder"
  schedule = "0 9 * * 0"

[[scheduled_functions]]
  name = "platform-daily-story"
  schedule = "0 8 * * *"

[[scheduled_functions]]
  name = "feature-education-drip"
  schedule = "0 10 * * 3"


# ── Redirects ─────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.well-known/assetlinks.json"
  status = 200
  force = true

# ── @username short URLs ──────────────────────────────────────────────────────
# feelzmachine.com/@og-sfm → renders /artist/og-sfm
[[redirects]]
  from = "/@:slug"
  to = "/artist/:slug"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/*/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/player/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/service-worker.js"
  to = "/service-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "/player"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/player/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200