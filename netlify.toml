[build]
  command = "sed -i \"s/feelz-v[0-9]*/feelz-$(date +%Y%m%d%H%M)/g\" public/service-worker.js && npm run build" 
  publish = "build"

[build.environment]
  REACT_APP_VAPID_PUBLIC_KEY = "BASwU9c4nwdW8W43aOOrqfiYooWNHM_wkVdJTblUyBsjdFpOOtRIJBtTD7vw6fJU9AlEg3sOL_n5mp0RabRWSPc"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."convert-to-mp4"]
  included_files = ["node_modules/ffmpeg-static/**"]
  timeout = 26

# ── Cache headers ─────────────────────────────────────────────────────────────
# service-worker.js must NEVER be cached by the browser HTTP cache.
# Safari/iOS was caching this for up to 24hrs, blocking updates.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# HTML entry point — always revalidate so new deploys are picked up
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed JS/CSS chunks — immutable, cache forever (hash changes on redeploy)
[[headers]]
  for = "/static/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media/font assets — cache for a week, revalidate
[[headers]]
  for = "/static/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Scheduled functions ───────────────────────────────────────────────────────
[[scheduled_functions]]
  name = "engagement-drip-cron"
  schedule = "0 8 * * 1,4"

[[scheduled_functions]]
  name = "monthly-wrapped"
  schedule = "0 9 1 * *"

[[scheduled_functions]]
  name = "daily-spotlight"
  schedule = "5 0 * * *"

[[scheduled_functions]]
  name = "weekly-artist-report"
  schedule = "0 8 * * 1"

[[scheduled_functions]]
  name = "weekly-listener-recap"
  schedule = "0 18 * * 0"

[[scheduled_functions]]
  name = "presave-notify"
  schedule = "0 9 * * *"

# ── Redirects ─────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.well-known/assetlinks.json"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/*/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/player/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/service-worker.js"
  to = "/service-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "/player"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/player/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200