[build]
  command = "sed -i \"s/feelz-v[0-9]*/feelz-$(date +%Y%m%d%H%M)/g\" public/service-worker.js && NODE_OPTIONS=--max-old-space-size=4096 npm run build"
  publish = "build"

[build.environment]
  REACT_APP_VAPID_PUBLIC_KEY = "BASwU9c4nwdW8W43aOOrqfiYooWNHM_wkVdJTblUyBsjdFpOOtRIJBtTD7vw6fJU9AlEg3sOL_n5mp0RabRWSPc"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."convert-audio"]
  included_files = ["node_modules/ffmpeg-static/**"]
  timeout = 26

[functions."engagement-drip-background"]
  timeout = 860
  # Merged into the existing table rather than added as a second
  # [functions."engagement-drip-background"] block — TOML forbids defining the
  # same table twice, and the whole file would fail to parse.
  schedule = "0 8 * * 1,4"

# ── Edge functions ────────────────────────────────────────────────────────────
#
# social-preview was registered TWICE: here, as five [[edge_functions]] blocks,
# and again in the function's own `export const config = { path: [...] }`.
# Netlify merges the two declarations, so every request to /artist/*, /track/*,
# /beat/*, /album/* and /schoolsessions was registering the same function on
# the same path twice. That is a known source of intermittent 5xx at the edge,
# which is what /artist/stevecsa was returning.
#
# The declaration now lives in one place: netlify/edge-functions/social-preview.js.
# Do not add [[edge_functions]] blocks for it back here — change the paths in
# the function's config instead, so there is only ever one source of truth.

# ── Cache headers ─────────────────────────────────────────────────────────────

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/static/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Scheduled functions ───────────────────────────────────────────────────────
#
# READ THIS BEFORE EDITING. Every one of these used to be declared as:
#
#     [[scheduled_functions]]
#       name = "daily-spotlight"
#       schedule = "5 0 * * *"
#
# `scheduled_functions` is not a key Netlify reads. A function is put on a
# schedule in netlify.toml through its own table:
#
#     [functions."daily-spotlight"]
#       schedule = "5 0 * * *"
#
# Netlify ignores configuration keys it does not recognise rather than failing
# the build. So nineteen declarations sat in this file looking entirely
# correct, every build went green, and not one function was ever registered as
# scheduled. That is why all of them show no output — the engagement drip since
# 3 July, and recs_last_run and prune_events_last_run never written at all.
#
# The only other way to schedule one is in the function's own code:
#
#     const { schedule } = require('@netlify/functions');
#     exports.handler = schedule('@daily', myHandler);
#
# Nothing here does that either: @netlify/functions is not a dependency, and
# all nineteen are plain `exports.handler`. netlify.toml was the only thing
# that could have scheduled them, and it wasn't.
#
# HOW TO CONFIRM, after deploying this:
#   Netlify → Functions. A scheduled function is labelled Scheduled and shows
#   its next run time. If none of them carry that label, the schedule is still
#   not being read — tell me rather than waiting a day to see.
#
# All nineteen names were checked against netlify/functions/: every one
# resolves to a real file, so nothing here points at a function that is gone.
#
# engagement-drip-background is scheduled in its [functions."..."] table above,
# merged with its 860s timeout — Mon and Thu 08:00.

# daily 02:00
[functions."update-engagement-scores"]
  schedule = "0 2 * * *"

# daily 03:00 — writes listener_behavior_profiles
[functions."compute-behavior-profiles"]
  schedule = "0 3 * * *"

# daily 03:30
[functions."score-engagement-outcomes"]
  schedule = "30 3 * * *"

# twice daily — must follow the behaviour profiles above; feeds ForYouPage
[functions."compute-recommendations"]
  schedule = "30 3,15 * * *"

# daily 04:00 — calls prune_listening_events(); nothing else does
[functions."prune-listening-events"]
  schedule = "0 4 * * *"

# daily 04:00
[functions."cleanup-mp4-conversions"]
  schedule = "0 4 * * *"

# daily 00:05
[functions."daily-spotlight"]
  schedule = "5 0 * * *"

# daily 02:00
[functions."cleanup-stories"]
  schedule = "0 2 * * *"

# daily 02:30
[functions."cleanup-empty-albums"]
  schedule = "30 2 * * *"

# daily 08:00
[functions."platform-daily-story"]
  schedule = "0 8 * * *"

# daily 09:00
[functions."presave-notify"]
  schedule = "0 9 * * *"

# Mon 08:00
[functions."weekly-artist-report"]
  schedule = "0 8 * * 1"

# Sun 09:00 — new challenge
[functions."weekly-wheel-spin"]
  schedule = "0 9 * * 0"

# Sun 09:00 — internal check
[functions."paid-collab-reminder"]
  schedule = "0 9 * * 0"

# Sun 18:00
[functions."weekly-listener-recap"]
  schedule = "0 18 * * 0"

# Sun 23:59 — crowns the winner, pays out, notifies
[functions."close-wheel-competition"]
  schedule = "59 23 * * 0"

# 1st of the month 09:00
[functions."monthly-wrapped"]
  schedule = "0 9 1 * *"

# 01:00 daily — end subscriptions whose expiry has passed, paid and granted
# alike. useTier already refuses an expired tier at read time; this is what
# writes it down, so the row, the tier column and the admin counts agree.
[functions."expire-subscriptions"]
  schedule = "0 1 * * *"

# Monday 07:00 — release royalties that have built up past an artist's
# threshold, plus anything that has been waiting more than 60 days whatever
# the amount. Without this, an artist who sells once below their threshold
# and never sells again waits forever: the money is recorded, owed, and
# unreachable. Weekly rather than daily because each run is a PayPal payout
# batch, and batching is the entire point of having a threshold.
[functions."release-pending-payouts"]
  schedule = "0 7 * * 1"

# feature-education-drip is deliberately NOT scheduled. Its schedule was
# already commented out here — "platform tips not landing" — and switching it
# on as a side effect of a syntax fix would start sending something that was
# turned off on purpose. Uncomment when you want it back:
#
# [functions."feature-education-drip"]
#   schedule = "0 10 * * 3"

# ── Redirects ─────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.well-known/assetlinks.json"
  status = 200
  force = true

# ── @username short URLs ──────────────────────────────────────────────────────
# feelzmachine.com/@og-sfm → loads SPA, React Router handles /@:slug route
[[redirects]]
  from = "/@:slug"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/*/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/player/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/service-worker.js"
  to = "/service-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "/player"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/player/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms-of-use"
  status = 301

# ── retail.feelzmachine.com → straight to the retail player ─────────────────
# Only takes effect once the subdomain is added as a domain alias in Netlify
# and its DNS points here — the redirect itself is harmless until then.
[[redirects]]
  from = "/"
  to = "/retail"
  status = 200
  force = true
  conditions = {Host = ["retail.feelzmachine.com"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200